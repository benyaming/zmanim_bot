[project]
name = "zmanim-bot"
version = "1.0.0"
description = ""
authors = [
    {name = "Benyamin Ginzburg", email = "benyomin.94@gmail.com"},
]
dependencies = [
    "pillow==11.0.0",
    "aiogram==2.24",
    "zmanim==0.3.1",
    "pydantic[dotenv]==1.10.9",
    "redis==4.4.1",
    "betterlogging==1.0.0",
    "odmantic==0.9.2",
    "motor==3.1.2",
    "pymongo==4.3.3",
    "sentry-sdk==1.13.0",
    "aiogram-metrics==1.0.4",
    "setuptools==75.2.0",
    "urllib3==2.2.3",
]
requires-python = "==3.10.7"
license = {text = "-"}

# Developer task shortcuts (uv standard). Run with `uv run <name>`:
#   uv run babel-extract
#   uv run babel-init en
#   uv run babel-compile
[project.scripts]
babel-extract = "zmanim_bot.tasks:babel_extract"
babel-init = "zmanim_bot.tasks:babel_init"
babel-compile = "zmanim_bot.tasks:babel_compile"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zmanim_bot"]
